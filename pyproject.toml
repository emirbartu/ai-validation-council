[project]
name = "ai-validation-council"
version = "0.1.0"
description = "Multi-agent AI council for startup idea validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<0.120.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=1.1.0,<1.2.0",
    # LLM access (OpenAI-compatible)
    "httpx>=0.27.0",
    "qdrant-client[fast]>=1.17.0,<1.18.0",
    # Data validation & settings
    "pydantic>=2.2.1,<3.0.0",
    "pydantic-settings>=2.0.0",
    # Logging & CLI
    "loguru>=0.7.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "asyncpraw>=7.8.0,<8.0.0",
    # Database (async)
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    # Embeddings (local, offline-first)
    "sentence-transformers>=3.0.0",
    # Cache & queue
    "redis>=5.0.0",
    # Performance
    "orjson>=3.10.0",
    # UUID generation
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "bandit[toml]>=1.7.0",
]

[project.scripts]
council = "council.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/council"]

# ─── Ruff: Linting & Formatting ───
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ─── pytest ───
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests that require Docker services",
]

# ─── Coverage ───
[tool.coverage.run]
source = ["src/council"]
branch = true

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ─── Bandit (security) ───
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
